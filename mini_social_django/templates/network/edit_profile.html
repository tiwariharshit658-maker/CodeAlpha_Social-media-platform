{% extends "base.html" %}
{% block title %}Edit profile · Mini Social{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="card auth-card">
  <p class="eyebrow">MAKE IT YOURS</p><h1>Edit your profile</h1><p class="muted">Tell the community a little about yourself.</p>
  <form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}<button class="button primary full" type="submit">Save changes</button></form>
  <a class="text-link" href="{% url 'profile' user.username %}">← Back to profile</a>
</section></div>
{% endblock %}
