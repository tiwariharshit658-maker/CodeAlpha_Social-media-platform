{% extends "base.html" %}
{% block title %}Log in · Mini Social{% endblock %}
{% block content %}
<div class="auth-wrap"><section class="card auth-card"><p class="eyebrow">WELCOME BACK</p><h1>Good to see you.</h1><p class="muted">Log in to pick up where you left off.</p>
<form method="post" class="stack-form">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary full" type="submit">Log in</button></form>
<p class="muted">New here? <a href="{% url 'signup' %}">Create an account</a></p></section></div>
{% endblock %}
